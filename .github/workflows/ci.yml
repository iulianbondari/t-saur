# CI for the T-saur reference implementation (activated when the repository goes public).
# Builds and tests on Linux, macOS and Windows, then checks that the same inputs produce
# byte-identical archives on every platform (determinism is a format guarantee).
name: ci

on:
  push:
    branches: [main]
    # documentation-only changes do not need three operating systems (the list is repeated
    # below: YAML anchors are not relied on in workflow files)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "CITATION.cff"
      - "LICENSE-*"
      - "licenses/**"
      - ".github/rulesets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "CITATION.cff"
      - "LICENSE-*"
      - "licenses/**"
      - ".github/rulesets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".gitignore"
      - ".gitattributes"
  # run the full matrix on demand for any branch (Actions tab -> ci -> Run workflow)
  workflow_dispatch:

# A new push to the same pull request cancels the run that is still going for the older commit;
# pushes to main are never cancelled (each one is a record).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes are billed at ten times the Linux rate, so pull requests run on Linux and
        # Windows; every push to main and every manual run covers all three (the ruleset for main
        # requires the Linux and Windows checks and the determinism comparison on pull requests)
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # third-party actions pinned to commit SHAs (the tag is in the comment)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # both target directories: the lite build (no default features) has its own
          workspaces: |
            tsaur -> target
            tsaur -> target-nolepton
      - name: Build
        run: cargo build --release --workspace
        working-directory: tsaur
      - name: Test
        run: cargo test --release --workspace
        working-directory: tsaur
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: tsaur
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: tsaur
      - name: Lite build (no Lepton) and its tests
        run: |
          cargo build --release --no-default-features --target-dir target-nolepton
          cargo test --release --no-default-features --target-dir target-nolepton
        working-directory: tsaur
      - name: Golden archives read by both release binaries, guide executed with both
        shell: bash
        run: |
          py=python3; bin=tsaur
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; bin=tsaur.exe; fi
          "$py" --version
          "$py" tools/compat_check.py
          "$py" tools/check_guide.py --tsaur "tsaur/target/release/$bin"
          "$py" tools/check_guide.py --tsaur "tsaur/target-nolepton/release/$bin"
      - name: Determinism fixture
        shell: bash
        run: |
          # relative paths on purpose: on the Windows runner the shell and Python resolve /tmp differently
          py=python3; bin=tsaur
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; bin=tsaur.exe; fi
          mkdir -p det && printf 'the same input must give the same archive everywhere\n%.0s' {1..5000} > det/a.txt
          printf 'fixed bytes for the determinism check\n%.0s' {1..2000} > det/b.bin
          "./tsaur/target/release/$bin" pack det.tsr det --codec zstd
          # the same fixture with the codec decided on a sample (its 275 KiB block is above the
          # 128 KiB full-trial threshold): the sampled path must be as deterministic as the default
          "./tsaur/target/release/$bin" pack det-effort3.tsr det --effort 3
          "$py" - <<'EOF'
          import hashlib, pathlib, platform
          # one line per archive, "<sha256>  <platform> <variant>", newline-terminated: the compare
          # job concatenates these files
          plat = platform.system().lower()
          lines = []
          for variant, name in (("default", "det.tsr"), ("effort3", "det-effort3.tsr")):
              h = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              lines.append(f"{h}  {plat} {variant}\n")
              print(plat, variant, h)
          pathlib.Path('det-' + plat + '.sha256').write_text(''.join(lines))
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: determinism-${{ matrix.os }}
          path: det-*.sha256

  determinism:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Compare archive hashes across platforms
        run: |
          # Each file holds one line per archive variant, "<sha256>  <platform> <variant>\n". One
          # file per matrix entry is required (two on pull requests, three on pushes to main and
          # manual runs) and exactly one distinct hash per variant; the earlier form (`cat | sort -u
          # | wc -l` over files without a trailing newline) joined the hashes into one line and
          # never compared.
          python3 - <<'EOF'
          import os, pathlib, sys
          expected = 2 if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request' else 3
          files = sorted(pathlib.Path('.').glob('det-*.sha256'))
          rows = [line.split() for f in files for line in f.read_text().splitlines()]
          for r in rows:
              print(*r)
          variants = ('default', 'effort3')
          if len(files) != expected or any(len(r) != 3 or len(r[0]) != 64 or r[2] not in variants for r in rows):
              sys.exit(f"expected {expected} well-formed hash files with the variants {variants}, got {len(files)}: {rows}")
          for v in variants:
              vrows = [r for r in rows if r[2] == v]
              hashes = {r[0] for r in vrows}
              if len(vrows) != expected or len(hashes) != 1:
                  sys.exit(f"the {v} archive differs between platforms: {sorted(hashes)} ({len(vrows)} rows)")
              print(f"{v}: identical on every platform of this run ({', '.join(r[1] for r in vrows)})")
          EOF
