# CI for the T-saur reference implementation (activated when the repository goes public).
# Builds and tests on Linux, macOS and Windows, then checks that the same inputs produce
# byte-identical archives on every platform (determinism is a format guarantee).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tsaur
      - name: Build
        run: cargo build --release --workspace
        working-directory: tsaur
      - name: Test
        run: cargo test --release --workspace
        working-directory: tsaur
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: tsaur
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: tsaur
      - name: Lite build (no Lepton, no LGPL code) and its tests
        run: |
          cargo build --release --no-default-features --target-dir target-nolepton
          cargo test --release --no-default-features --target-dir target-nolepton
        working-directory: tsaur
      - name: Golden archives read by both release binaries, guide executed with both
        shell: bash
        run: |
          py=python3; bin=tsaur
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; bin=tsaur.exe; fi
          "$py" --version
          "$py" tools/compat_check.py
          "$py" tools/check_guide.py --tsaur "tsaur/target/release/$bin"
          "$py" tools/check_guide.py --tsaur "tsaur/target-nolepton/release/$bin"
      - name: Determinism fixture
        shell: bash
        run: |
          # relative paths on purpose: on the Windows runner the shell and Python resolve /tmp differently
          py=python3; bin=tsaur
          if [ "$RUNNER_OS" = "Windows" ]; then py=python; bin=tsaur.exe; fi
          mkdir -p det && printf 'the same input must give the same archive everywhere\n%.0s' {1..5000} > det/a.txt
          printf 'fixed bytes for the determinism check\n%.0s' {1..2000} > det/b.bin
          "./tsaur/target/release/$bin" pack det.tsr det --codec zstd
          "$py" - <<'EOF'
          import hashlib, pathlib, platform
          h = hashlib.sha256(pathlib.Path('det.tsr').read_bytes()).hexdigest()
          # one line per platform, newline-terminated: the compare job concatenates these files
          pathlib.Path('det-' + platform.system().lower() + '.sha256').write_text(f"{h}  {platform.system().lower()}\n")
          print(platform.system(), h)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: det-*.sha256

  determinism:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - name: Compare archive hashes across platforms
        run: |
          # Each file holds "<sha256>  <platform>\n". Three files are required (one per matrix
          # entry) and exactly one distinct hash; the earlier form (`cat | sort -u | wc -l` over
          # files without a trailing newline) joined the hashes into one line and never compared.
          python3 - <<'EOF'
          import pathlib, sys
          files = sorted(pathlib.Path('.').glob('det-*.sha256'))
          rows = [f.read_text().split() for f in files]
          for f, r in zip(files, rows):
              print(f.name, *r)
          hashes = {r[0] for r in rows}
          if len(files) != 3 or any(len(r) != 2 or len(r[0]) != 64 for r in rows):
              sys.exit(f"expected three well-formed hash files, got {len(files)}: {rows}")
          if len(hashes) != 1:
              sys.exit(f"the archive differs between platforms: {sorted(hashes)}")
          print("identical on every platform")
          EOF
