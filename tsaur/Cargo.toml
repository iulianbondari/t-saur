[workspace]
resolver = "2"
members = ["crates/tsaur-core", "crates/tsaur-cli"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/iulianbondari/t-saur"
homepage = "https://github.com/iulianbondari/t-saur"
authors = ["T-saur contributors"]
keywords = ["archive", "compression", "ai-agents", "content-addressed", "mcp"]
categories = ["compression", "filesystem", "command-line-utilities"]
rust-version = "1.87"

[profile.release]
lto = "thin"
codegen-units = 1
