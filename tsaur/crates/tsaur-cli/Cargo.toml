[package]
name = "tsaur"
description = "T-saur (.tsr) command-line archiver: content-addressed, agent-first archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[[bin]]
name = "tsaur"
path = "src/main.rs"

[features]
default = ["lepton"]
lepton = ["tsaur-core/lepton"]

[dependencies]
tsaur-core = { path = "../tsaur-core", version = "1.0.0-rc.1", default-features = false }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
glob = "0.3"
hex = "0.4"
regex = "1"
base64 = "0.22"
