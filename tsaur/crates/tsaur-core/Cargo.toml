[package]
name = "tsaur-core"
description = "T-saur (.tsr): a content-addressed, agent-first archive format — core library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[features]
default = ["lepton"]
# Lossless JPEG recompression. `lepton_jpeg` (Apache-2.0) depends on `cabac` (LGPL-3.0-or-later);
# build with `--no-default-features` for a binary without LGPL code (JPEGs are then stored as they are,
# and archives that contain Lepton segments cannot be opened by such a build).
lepton = ["dep:lepton_jpeg"]

[dependencies]
blake3 = "1"
zstd = "0.13"
# optional per-block xz/LZMA2 codec (bundled liblzma, statically linked)
liblzma = { version = "0.4", features = ["static"] }
# PPMd (variant H, 7z range coder) for text blocks — pure Rust, CC0/MIT-0
ppmd-rust = "1"
# Lepton: lossless JPEG recompression (~22 % smaller, bit-exact) — Microsoft, Apache-2.0
lepton_jpeg = { version = "0.5", optional = true }
# canonical (semantic) views for agents: DOCX XML -> Markdown, PDF -> text
quick-xml = "0.42"
pdf-extract = "0.12"
flate2 = "1"
fastcdc = "3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
# hybrid post-quantum recipients: X25519 + ML-KEM-768 (FIPS 203)
ml-kem = { version = "0.3", features = ["getrandom"] }
kem = { version = "0.3", features = ["getrandom"] }
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
# encrypted, peer-pinned transport for the volume exchange (TLS 1.3, self-signed certificates
# pinned by SHA-256 fingerprint on both sides; ring provider: no CMake/NASM needed)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = { version = "1", features = ["std"] }
getrandom = "0.2"
ed25519-dalek = "2"
reed-solomon-erasure = "6"
# preflate inverts deflate streams and recreates them bit-exact whatever encoder produced them
preflate-rs = "0.7"
unicode-normalization = "0.1"
thiserror = "2"
rayon = "1"
hex = "0.4"
crc32fast = "1"
memmap2 = "0.9"

[dev-dependencies]
# only used to build ZIP / zlib fixtures in tests
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
